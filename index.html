  <style>
    .mobile-nav{display:none}
    @media(max-width:850px){
      .topbar{height:64px;padding:0 16px}.page-title{font-size:17px}.mobile-nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5ece9;box-shadow:0 5px 14px rgba(31,72,63,.05)}.mobile-nav button{min-height:40px;border-radius:9px;background:#eef6f2;color:#205b54;font-size:12px;font-weight:800}.mobile-nav button:last-child{background:#205b54;color:#fff}.main{padding:18px 14px}.welcome-hero{border-radius:14px}.welcome-copy{padding:28px 22px}.welcome-copy h1{font-size:28px}.welcome-image{min-height:185px}.metrics{margin-bottom:18px}.metric{padding:16px 17px}.section-head{padding:19px 17px 15px}.section-head h2{font-size:18px}.section-actions{width:100%}.section-actions .button{flex:1;padding:11px 8px}.table-tools{padding:0 17px 15px}.table-wrap{border-radius:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.table-wrap::after{content:'Swipe to view all columns';display:block;padding:7px 16px;color:#718087;font-size:11px;background:#f8fbf9}th,td{padding:13px 14px}.form-card{padding:21px 17px}.member-form{gap:15px}.field input{min-height:46px}.detail-grid div{padding:15px 17px}}
    .print-header{display:none}
    @media print{.print-header{display:flex!important;flex-direction:column;gap:5px;padding:0 0 16px;font-size:11pt;color:#243a42}.print-header strong{font-size:18pt}.print-header span{font-size:10pt;color:#52605d}}
  </style>
</head>
